<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小米实况图片拆分脚本与网页支持示例</title>
<style>
    :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --border: #2a2a2a;
        --text: #e0e0e0;
        --text-secondary: #888;
        --accent: #ffffff;
        --radius: 12px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', 'PingFang SC', -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
    }

    /* ========== 首屏画廊 ========== */
    .hero {
        position: relative;
        width: 100%;
        height: 90vh;
        min-height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .hero-header {
        position: relative;
        z-index: 5;
        text-align: center;
        pointer-events: none;
    }

    .hero-header h1 {
        font-size: clamp(2.4rem, 6vw, 4rem);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.1;
        color: var(--accent);
    }

    .hero-header .subtitle {
        margin-top: 12px;
        font-size: 0.85rem;
        color: var(--text-secondary);
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    /* ========== 环绕卡片 ========== */
    .orbit {
        position: absolute;
        inset: 0;
        z-index: 3;
    }

    .motion-card {
        position: absolute;
        --rot: 0deg;
        border-radius: var(--radius);
        overflow: hidden;
        background: transparent;
        border: 1px solid var(--border);
        max-width: 300px;
        max-height: 65vh;
        width: fit-content;
        height: fit-content;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        opacity: 0;
        animation: fadeSlideIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.3s ease,
                    border-color 0.3s ease;
    }

    .motion-card:nth-child(1) { animation-delay: 0.05s; }
    .motion-card:nth-child(2) { animation-delay: 0.15s; }
    .motion-card:nth-child(3) { animation-delay: 0.25s; }
    .motion-card:nth-child(4) { animation-delay: 0.35s; }
    .motion-card:nth-child(5) { animation-delay: 0.45s; }
    .motion-card:nth-child(n+6) { animation-delay: 0.55s; }

    @keyframes fadeSlideIn {
        0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scale(0.6); }
        100% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); }
    }

    .motion-card:hover {
        transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.1) !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        z-index: 10;
        border-color: #666;
    }

    .motion-card.dragging {
        cursor: grabbing;
        transition: none !important;
        z-index: 100 !important;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
        border-color: #888;
    }

    /* ========== 图片容器 ========== */
    .photo-container {
        position: relative;
        line-height: 0;
        background: transparent;
        border-radius: var(--radius);
        overflow: hidden;
    }

    .photo-container img {
        display: block;
        width: auto;
        height: auto;
        max-width: 300px;
        max-height: 55vh;
    }

    .photo-container video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .photo-container.playing img { opacity: 0; }
    .photo-container.playing video { opacity: 1; }

    /* ========== LIVE 指示器 ========== */
    .indicator {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        color: #fff;
        pointer-events: auto;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: transform 0.2s ease, background 0.2s ease;
    }

    .indicator:active {
        transform: scale(0.95);
        background: rgba(0, 0, 0, 0.8);
    }

    .indicator .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ff3b30;
        animation: livePulse 1.6s ease-in-out infinite;
    }

    .indicator.playing .dot {
        background: #34c759;
    }

    @keyframes livePulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
    }

    /* ========== 卡片底部 ========== */
    .card-info {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 3;
        padding: 16px 12px 10px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
    }

    .motion-card:hover .card-info {
        opacity: 1;
        transform: translateY(0);
    }

    .card-info .label {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.9);
    }

    /* ========== 移动端全屏查看 ========== */
    .lightbox {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .lightbox.active {
        opacity: 1;
        visibility: visible;
    }

    .lightbox-content {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .lightbox-media {
        position: relative;
        max-width: 100%;
        max-height: 80vh;
        border-radius: var(--radius);
        overflow: hidden;
    }

    .lightbox-media img,
    .lightbox-media video {
        display: block;
        max-width: 100%;
        max-height: 80vh;
        width: auto;
        height: auto;
    }

    .lightbox-media video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .lightbox-media.playing img { opacity: 0; }
    .lightbox-media.playing video { opacity: 1; }

    .lightbox-indicator {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        font-size: 0.8rem;
        color: #fff;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .lightbox-indicator .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff3b30;
        animation: livePulse 1.6s ease-in-out infinite;
    }

    .lightbox-indicator.playing .dot {
        background: #34c759;
    }

    .lightbox-close {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        cursor: pointer;
        border: none;
        color: #fff;
        font-size: 1.5rem;
    }

    .lightbox-hint {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
    }

    /* ========== 底部说明 ========== */
    .footer-note {
        padding: 60px 32px 40px;
        text-align: center;
        font-size: 0.75rem;
        color: #444;
        letter-spacing: 0.04em;
        line-height: 1.6;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 900px) {
        .hero {
            height: 80vh;
            min-height: 500px;
        }
    }

    @media (max-width: 640px) {
        .hero {
            height: auto;
            min-height: auto;
            padding: 80px 20px 40px;
            flex-direction: column;
        }

        .hero-header {
            margin-bottom: 40px;
        }

        .orbit {
            position: relative;
            inset: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
        }

        .motion-card {
            position: relative;
            left: auto !important;
            top: auto !important;
            width: 100% !important;
            height: auto !important;
            max-width: none;
            max-height: none;
            transform: none !important;
            animation: fadeIn 0.6s ease forwards;
            cursor: pointer;
        }

        .motion-card:active {
            transform: scale(0.98) !important;
        }

        .photo-container img {
            max-width: 100%;
            max-height: none;
            width: 100%;
            height: auto;
        }

        .card-info {
            opacity: 1;
            transform: none;
            padding: 12px 10px 8px;
        }

        .indicator {
            top: 8px;
            right: 8px;
            padding: 5px 10px;
            font-size: 0.65rem;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    }
</style>
</head>
<body>

<div class="hero">
    <header class="hero-header">
        <h1>小米实况图片</h1>
        <p class="subtitle">Xiaomi LivePhoto · 拆分与展示示例</p>
    </header>

    <div class="orbit" id="orbit"></div>
</div>

<p class="footer-note">
    基于小米动态照片拆分技术 · 悬停播放<br>
    Extracted from Xiaomi Motion Photo
</p>

<!-- 移动端全屏查看 -->
<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <div class="lightbox-content">
        <div class="lightbox-media" id="lightboxMedia">
            <img src="" alt="" id="lightboxImg">
            <video src="" loop playsinline id="lightboxVideo"></video>
            <div class="lightbox-indicator" id="lightboxIndicator">
                <span class="dot"></span>
                LIVE
            </div>
        </div>
    </div>
    <div class="lightbox-hint">长按播放实况图 · 点击 LIVE 播放</div>
</div>

<script>
    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
    let currentLightboxVideo = null;

    function createMotionCard(photo) {
        const card = document.createElement('div');
        card.className = 'motion-card';
        card.dataset.id = photo.id;
        card.dataset.cover = photo.cover;
        card.dataset.video = photo.video;
        card.innerHTML = `
            <div class="photo-container">
                <img src="${photo.cover}" alt="${photo.title}" loading="lazy" onerror="this.style.display='none'">
                <video src="${photo.video}" loop playsinline preload="metadata" onerror="this.style.display='none'"></video>
                <div class="indicator" data-action="play">
                    <span class="dot"></span>
                    LIVE
                </div>
                <div class="card-info">
                    <div class="label">${photo.title}</div>
                </div>
            </div>
        `;
        return card;
    }

    function arrangeInOrbit(orbit) {
        const cards = orbit.querySelectorAll('.motion-card');
        const count = cards.length;
        if (count === 0) return;

        const rect = orbit.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const radiusX = Math.min(cx, cy) * 0.55;
        const radiusY = Math.min(cx, cy) * 0.42;
        const rotations = [-3.2, 2.8, -1.6, 4.1, -2.4, 1.8, -3.8, 2.2];
        const radiusOffsets = [1.0, 0.88, 1.06, 0.92, 1.1, 0.95, 0.85, 1.02];

        cards.forEach((card, i) => {
            const idx = i % rotations.length;
            const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
            const x = cx + Math.cos(angle) * radiusX * radiusOffsets[idx];
            const y = cy + Math.sin(angle) * radiusY * radiusOffsets[idx];
            card.style.left = x + 'px';
            card.style.top = y + 'px';
            card.style.setProperty('--rot', rotations[idx] + 'deg');
        });
    }

    // 桌面端拖拽
    function makeDraggable(card) {
        if (isTouchDevice) return;
        
        let isDragging = false, startX, startY, origLeft, origTop;

        card.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            origLeft = parseFloat(card.style.left) || 0;
            origTop = parseFloat(card.style.top) || 0;
            card.classList.add('dragging');
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            card.style.left = (origLeft + e.clientX - startX) + 'px';
            card.style.top = (origTop + e.clientY - startY) + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            card.classList.remove('dragging');
        });
    }

    // 桌面端悬停播放
    function bindHoverPlay(card) {
        if (isTouchDevice) return;
        
        const container = card.querySelector('.photo-container');
        const video = container.querySelector('video');
        if (!video) return;

        // 绑定到 photo-container 而不是 card，更精确
        container.addEventListener('mouseenter', () => {
            if (card.classList.contains('dragging')) return;
            container.classList.add('playing');
            video.currentTime = 0;
            video.play().catch(() => {});
        });

        container.addEventListener('mouseleave', () => {
            container.classList.remove('playing');
            video.pause();
        });
    }

    // 移动端 Lightbox
    function openLightbox(coverSrc, videoSrc) {
        const lightbox = document.getElementById('lightbox');
        const img = document.getElementById('lightboxImg');
        const video = document.getElementById('lightboxVideo');
        const indicator = document.getElementById('lightboxIndicator');
        const media = document.getElementById('lightboxMedia');

        img.src = coverSrc;
        video.src = videoSrc;
        currentLightboxVideo = video;
        
        media.classList.remove('playing');
        indicator.classList.remove('playing');
        
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        const video = document.getElementById('lightboxVideo');
        const media = document.getElementById('lightboxMedia');
        const indicator = document.getElementById('lightboxIndicator');

        video.pause();
        media.classList.remove('playing');
        indicator.classList.remove('playing');
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        currentLightboxVideo = null;
    }

    function toggleLightboxPlay() {
        const video = document.getElementById('lightboxVideo');
        const media = document.getElementById('lightboxMedia');
        const indicator = document.getElementById('lightboxIndicator');

        if (media.classList.contains('playing')) {
            video.pause();
            media.classList.remove('playing');
            indicator.classList.remove('playing');
        } else {
            video.currentTime = 0;
            video.play().catch(() => {});
            media.classList.add('playing');
            indicator.classList.add('playing');
        }
    }

    // 移动端长按播放
    function bindTouchInteractions(card) {
        if (!isTouchDevice) return;

        const cover = card.dataset.cover;
        const videoSrc = card.dataset.video;
        let longPressTimer = null;
        let isLongPress = false;

        // 点击打开 Lightbox
        card.addEventListener('click', (e) => {
            if (e.target.closest('.indicator')) return;
            openLightbox(cover, videoSrc);
        });

        // 卡片上的 LIVE 按钮
        const indicator = card.querySelector('.indicator');
        indicator.addEventListener('click', (e) => {
            e.stopPropagation();
            openLightbox(cover, videoSrc);
            setTimeout(toggleLightboxPlay, 300);
        });
    }

    // Lightbox 内交互
    function initLightbox() {
        const lightbox = document.getElementById('lightbox');
        const closeBtn = document.getElementById('lightboxClose');
        const media = document.getElementById('lightboxMedia');
        const indicator = document.getElementById('lightboxIndicator');
        let longPressTimer = null;
        let isLongPress = false;

        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.closest('.lightbox-content')) {
                closeLightbox();
            }
        });

        // 点击 LIVE 播放/暂停
        indicator.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleLightboxPlay();
        });

        // 长按播放
        media.addEventListener('touchstart', (e) => {
            isLongPress = false;
            longPressTimer = setTimeout(() => {
                isLongPress = true;
                toggleLightboxPlay();
            }, 400);
        }, { passive: true });

        media.addEventListener('touchend', () => {
            clearTimeout(longPressTimer);
        });

        media.addEventListener('touchmove', () => {
            clearTimeout(longPressTimer);
        });
    }

    async function loadPhotos() {
        const orbit = document.getElementById('orbit');

        try {
            const response = await fetch('./extracted/photos.json');
            if (!response.ok) throw new Error('照片清单未找到');
            const photos = await response.json();

            if (photos.length === 0) {
                orbit.innerHTML = '<p style="text-align:center;color:#666;padding:60px 0;width:100%;">暂无照片</p>';
                return;
            }

            photos.forEach(photo => {
                const card = createMotionCard(photo);
                orbit.appendChild(card);
                makeDraggable(card);
                bindHoverPlay(card);
                bindTouchInteractions(card);
            });

            requestAnimationFrame(() => arrangeInOrbit(orbit));
            initLightbox();

            window.addEventListener('resize', () => {
                if (!isTouchDevice) arrangeInOrbit(orbit);
            });
        } catch (e) {
            orbit.innerHTML = '<p style="text-align:center;color:#666;padding:60px 0;">加载失败</p>';
        }
    }

    loadPhotos();
</script>

</body>
</html>
