<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小米实况图片拆分脚本与网页支持示例</title>
<style>
    :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --border: #2a2a2a;
        --text: #e0e0e0;
        --text-secondary: #888;
        --accent: #ffffff;
        --radius: 12px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', 'PingFang SC', -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
    }

    /* ========== 首屏画廊 ========== */
    .hero {
        position: relative;
        width: 100%;
        height: 90vh;
        min-height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* 标题居中 */
    .hero-header {
        position: relative;
        z-index: 5;
        text-align: center;
        pointer-events: none;
    }

    .hero-header h1 {
        font-size: clamp(2.4rem, 6vw, 4rem);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.1;
        color: var(--accent);
    }

    .hero-header .subtitle {
        margin-top: 12px;
        font-size: 0.85rem;
        color: var(--text-secondary);
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    /* ========== 环绕卡片 ========== */
    .orbit {
        position: absolute;
        inset: 0;
        z-index: 3;
    }

    .motion-card {
        position: absolute;
        --rot: 0deg;
        border-radius: var(--radius);
        overflow: hidden;
        background: transparent;
        border: 1px solid var(--border);
        max-width: 300px;
        max-height: 65vh;
        width: fit-content;
        height: fit-content;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        opacity: 0;
        animation: fadeSlideIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.3s ease,
                    border-color 0.3s ease;
        touch-action: none;
    }

    .motion-card:nth-child(1) { animation-delay: 0.05s; }
    .motion-card:nth-child(2) { animation-delay: 0.15s; }
    .motion-card:nth-child(3) { animation-delay: 0.25s; }
    .motion-card:nth-child(4) { animation-delay: 0.35s; }
    .motion-card:nth-child(5) { animation-delay: 0.45s; }
    .motion-card:nth-child(n+6) { animation-delay: 0.55s; }

    @keyframes fadeSlideIn {
        0% {
            opacity: 0;
            transform: translate(-50%, -50%) rotate(var(--rot)) scale(0.6);
        }
        100% {
            opacity: 1;
            transform: translate(-50%, -50%) rotate(var(--rot)) scale(1);
        }
    }

    .motion-card:hover {
        transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.1) !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        z-index: 10;
        border-color: #666;
    }

    .motion-card.dragging {
        cursor: grabbing;
        transition: none !important;
        z-index: 100 !important;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
        border-color: #888;
    }

    .motion-card.dragging:hover {
        transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.1) !important;
    }

    /* ========== 图片容器 ========== */
    .photo-container {
        position: relative;
        line-height: 0;
        background: transparent;
        border-radius: var(--radius);
        overflow: hidden;
    }

    .photo-container img {
        display: block;
        width: auto;
        height: auto;
        max-width: 300px;
        max-height: 55vh;
    }

    .photo-container video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .photo-container img {
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .photo-container.playing img {
        opacity: 0;
    }

    .photo-container.playing video {
        opacity: 1;
    }

    /* ========== LIVE 指示器 ========== */
    .indicator {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 20px;
        font-size: 0.6rem;
        letter-spacing: 0.08em;
        color: #fff;
        pointer-events: none;
        transition: opacity 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .indicator .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #fff;
        animation: livePulse 1.6s ease-in-out infinite;
    }

    .photo-container.playing .indicator {
        opacity: 0;
    }

    @keyframes livePulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); }
    }

    /* ========== 卡片底部叠加 ========== */
    .card-info {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 3;
        padding: 16px 12px 10px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
    }

    .motion-card:hover .card-info {
        opacity: 1;
        transform: translateY(0);
    }

    .card-info .label {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.9);
        letter-spacing: 0.04em;
    }

    .card-info .hint {
        font-size: 0.6rem;
        color: rgba(255, 255, 255, 0.4);
        margin-top: 2px;
    }

    /* ========== 底部说明 ========== */
    .footer-note {
        padding: 60px 32px 40px;
        text-align: center;
        font-size: 0.75rem;
        color: #444;
        letter-spacing: 0.04em;
        line-height: 1.6;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 900px) {
        .hero {
            height: 80vh;
            min-height: 500px;
        }
    }

    @media (max-width: 640px) {
        .hero {
            height: auto;
            min-height: auto;
            padding: 80px 20px 40px;
            flex-direction: column;
        }

        .hero-header {
            margin-bottom: 40px;
        }

        .orbit {
            position: relative;
            inset: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
        }

        .motion-card {
            position: relative;
            left: auto !important;
            top: auto !important;
            width: 100% !important;
            height: auto !important;
            max-width: none;
            max-height: none;
            transform: none !important;
            animation: fadeIn 0.6s ease forwards;
        }

        .motion-card:hover {
            transform: scale(1.03) !important;
        }

        .photo-container img {
            max-width: 100%;
            max-height: none;
            width: 100%;
            height: auto;
        }

        .card-info {
            opacity: 1;
            transform: none;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    }
</style>
</head>
<body>

<div class="hero">
    <header class="hero-header">
        <h1>小米实况图片</h1>
        <p class="subtitle">Xiaomi LivePhoto · 拆分与展示示例</p>
    </header>

    <div class="orbit" id="orbit"></div>
</div>

<p class="footer-note">
    基于小米动态照片拆分技术 · 悬停播放<br>
    Extracted from Xiaomi Motion Photo
</p>

<script>
    function createMotionCard(photo) {
        const card = document.createElement('div');
        card.className = 'motion-card';
        card.innerHTML = `
            <div class="photo-container" data-id="${photo.id}">
                <img src="${photo.cover}"
                     alt="${photo.title}"
                     loading="lazy"
                     onerror="this.style.display='none'">
                <video src="${photo.video}"
                       loop
                       playsinline
                       preload="metadata"
                       onerror="this.style.display='none'">
                </video>
                <div class="indicator">
                    <span class="dot"></span>
                    LIVE
                </div>
                <div class="card-info">
                    <div class="label">${photo.title}</div>
                    <div class="hint">悬停播放 · Hover to play</div>
                </div>
            </div>
        `;
        return card;
    }

    function arrangeInOrbit(orbit) {
        const cards = orbit.querySelectorAll('.motion-card');
        const count = cards.length;
        if (count === 0) return;

        const rect = orbit.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;

        const radiusX = Math.min(cx, cy) * 0.55;
        const radiusY = Math.min(cx, cy) * 0.42;

        const rotations = [-3.2, 2.8, -1.6, 4.1, -2.4, 1.8, -3.8, 2.2];
        const radiusOffsets = [1.0, 0.88, 1.06, 0.92, 1.1, 0.95, 0.85, 1.02];

        cards.forEach((card, i) => {
            const idx = i % rotations.length;
            const rot = rotations[idx];
            const rOff = radiusOffsets[idx];

            const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
            const x = cx + Math.cos(angle) * radiusX * rOff;
            const y = cy + Math.sin(angle) * radiusY * rOff;

            card.style.left = x + 'px';
            card.style.top = y + 'px';
            card.style.setProperty('--rot', rot + 'deg');
        });
    }

    function makeDraggable(card) {
        let isDragging = false;
        let startX, startY, origLeft, origTop;
        let dragMoved = false;

        function onPointerDown(e) {
            isDragging = true;
            dragMoved = false;
            const point = e.touches ? e.touches[0] : e;
            startX = point.clientX;
            startY = point.clientY;
            origLeft = parseFloat(card.style.left) || 0;
            origTop = parseFloat(card.style.top) || 0;

            card.classList.add('dragging');
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const point = e.touches ? e.touches[0] : e;
            const dx = point.clientX - startX;
            const dy = point.clientY - startY;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                dragMoved = true;
            }

            card.style.left = (origLeft + dx) + 'px';
            card.style.top = (origTop + dy) + 'px';
        }

        function onPointerUp() {
            if (!isDragging) return;
            isDragging = false;
            card.classList.remove('dragging');
        }

        card.addEventListener('mousedown', onPointerDown);
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('mouseup', onPointerUp);

        card.addEventListener('touchstart', onPointerDown, { passive: true });
        document.addEventListener('touchmove', onPointerMove, { passive: true });
        document.addEventListener('touchend', onPointerUp);
    }

    function bindInteractions() {
        document.querySelectorAll('.photo-container').forEach(container => {
            const video = container.querySelector('video');
            if (!video) return;

            let playTimer = null;
            container._playTimer = null;

            container.addEventListener('mouseenter', () => {
                const card = container.closest('.motion-card');
                if (card?.classList.contains('dragging')) return;
                playTimer = setTimeout(() => {
                    container.classList.add('playing');
                    video.currentTime = 0;
                    video.play().catch(() => {});
                }, 200);
                container._playTimer = playTimer;
            });

            container.addEventListener('mouseleave', () => {
                clearTimeout(playTimer);
                container._playTimer = null;
                container.classList.remove('playing');
                video.pause();
            });

            container.addEventListener('touchstart', () => {
                const card = container.closest('.motion-card');
                if (card?.classList.contains('dragging')) return;
                playTimer = setTimeout(() => {
                    container.classList.add('playing');
                    video.currentTime = 0;
                    video.play().catch(() => {});
                }, 300);
                container._playTimer = playTimer;
            });

            container.addEventListener('touchend', () => {
                clearTimeout(playTimer);
                container._playTimer = null;
                container.classList.remove('playing');
                video.pause();
            });

            container.addEventListener('touchcancel', () => {
                clearTimeout(playTimer);
                container._playTimer = null;
                container.classList.remove('playing');
                video.pause();
            });

            video.addEventListener('ended', () => {
                container.classList.remove('playing');
            });
        });
    }

    let resizeTimer = null;

    function handleResize(orbit) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            arrangeInOrbit(orbit);
        }, 200);
    }

    async function loadPhotos() {
        const orbit = document.getElementById('orbit');

        try {
            const response = await fetch('./extracted/photos.json');
            if (!response.ok) throw new Error('照片清单未找到');
            const photos = await response.json();

            if (photos.length === 0) {
                orbit.innerHTML = '<p style="text-align:center;color:#666;padding:60px 0;width:100%;">暂无照片，请先运行 extract.js 提取</p>';
                return;
            }

            photos.forEach(photo => {
                const card = createMotionCard(photo);
                orbit.appendChild(card);
                makeDraggable(card);
            });

            requestAnimationFrame(() => {
                arrangeInOrbit(orbit);
                bindInteractions();
            });

            window.addEventListener('resize', () => handleResize(orbit));
        } catch (e) {
            orbit.innerHTML = `
                <div style="text-align:center;padding:60px 0;color:#666;width:100%;">
                    <p style="font-size:1.1rem;margin-bottom:8px;">暂无照片数据</p>
                    <p style="font-size:0.85rem;color:#555;">请先将小米动态照片放入 images/ 文件夹，然后运行:</p>
                    <code style="display:inline-block;margin-top:12px;padding:8px 16px;background:#1a1a1a;border-radius:8px;font-size:0.85rem;color:#aaa;">node extract.js</code>
                </div>
            `;
        }
    }

    loadPhotos();
</script>

</body>
</html>
